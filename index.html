<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkQTE - The Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #game-world {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            transform-origin: center center;
            will-change: transform;
        }

        .game-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            background-color: #000;
            transition: filter 0.5s ease;
        }

        /* BAR / CHAIN QTE */
        .qte-prompt-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
            text-align: center;
        }

        .qte-key {
            font-size: 12rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 60px rgba(79, 70, 229, 0.6);
            margin-bottom: 20px;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .qte-key.space-key {
            font-size: 6rem;
        }

        .qte-key.urgent {
            color: #fca5a5;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.7);
            animation: key-urgent 0.1s ease-in-out infinite alternate;
        }

        @keyframes key-urgent {
            from { transform: translateX(-4px); }
            to { transform: translateX(4px); }
        }

        .timer-container {
            width: 400px;
            height: 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #4f46e5;
            transform-origin: left center;
        }

        .qte-success {
            animation: success-pop 0.18s ease-out;
        }

        @keyframes success-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); color: #4ade80; }
            100% { transform: scale(1); }
        }

        .qte-fail {
            animation: fail-shake 0.28s ease-in-out;
        }

        @keyframes fail-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-18px); color: #ef4444; }
            75% { transform: translateX(18px); color: #ef4444; }
        }

        .seq-progress {
            margin-top: 16px;
            color: rgba(255,255,255,0.7);
            font-weight: 700;
            letter-spacing: 0.08em;
            font-size: 0.95rem;
        }

        /* CIRCLE QTE */
        .qte-circle {
            position: absolute;
            transform: translate(-50%, -50%);
            user-select: none;
            pointer-events: none;
            z-index: 20;
        }

        .target {
            width: 110px;
            height: 110px;
            background: rgba(30, 30, 40, 0.82);
            border: 3px solid rgba(255,255,255,0.85);
            border-radius: 50%;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 2.4rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            box-shadow: 0 0 24px rgba(79, 70, 229, 0.35);
        }

        .target.space-key {
            font-size: 1.15rem;
            letter-spacing: 0.06em;
        }

        .circle-life {
            position: absolute;
            left: 50%;
            bottom: -18px;
            transform: translateX(-50%);
            width: 72px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .circle-life-bar {
            height: 100%;
            width: 100%;
            background: #4f46e5;
        }

        .hit-ring-ghost {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(74, 222, 128, 0.55);
            background: rgba(34, 197, 94, 0.18);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9;
            animation: ghost-fade 0.9s ease-out forwards;
        }

        @keyframes ghost-fade {
            0% { width: 110px; height: 110px; opacity: 0.7; }
            100% { width: 320px; height: 320px; opacity: 0; }
        }

        .shake {
            animation: zoom-shake-anim 0.25s ease-out;
        }

        @keyframes zoom-shake-anim {
            0% { transform: scale(1); }
            30% { transform: scale(var(--scale-min, 0.85)); }
            60% { transform: scale(var(--scale-max, 1.08)); }
            100% { transform: scale(1); }
        }

        .fade-out {
            animation: fadeOut 0.22s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .cfg-row[hidden] {
            display: none !important;
        }
    </style>
</head>
<body class="bg-black">

    <div id="game-world">
        <div id="bg" class="game-bg"></div>
    </div>

    <div id="menu" class="fixed inset-0 flex items-center justify-center z-20 bg-slate-900/60 backdrop-blur-sm">
        <div id="menu-card" class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6 transition-all duration-300" style="border: 4px solid #4f46e5; box-shadow: 0 0 20px #4f46e5;">
            <div class="text-center">
                <h1 class="text-4xl font-black text-slate-800 tracking-tight">INK QTE</h1>
                <p class="text-slate-500">Configure your challenge</p>
            </div>

            <div id="menu-settings" class="space-y-4">
            </div>

            <button id="start-btn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xl rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                START GAME
            </button>
        </div>
    </div>

    <div id="hud" class="fixed top-6 left-6 z-30 hidden">
        <div class="bg-black/50 backdrop-blur-md text-white px-4 py-2 rounded-full font-bold border border-white/20">
            Misses: <span id="miss-count" class="text-red-400">0</span> / <span id="max-misses-val">3</span>
        </div>
    </div>

    <div id="game-over" class="fixed inset-0 flex items-center justify-center z-40 hidden bg-red-900/80 backdrop-blur-md">
        <div class="text-center text-white space-y-6">
            <h2 class="text-7xl font-black tracking-tighter italic">GAME OVER</h2>
            <p class="text-2xl font-medium opacity-80">You failed the trial.</p>
            <div class="flex flex-col gap-3 items-center">
                <button id="quick-restart-btn" class="px-8 py-3 bg-white text-red-600 font-black rounded-full hover:bg-slate-100 transition-all transform hover:scale-110 shadow-xl">
                    INSTANT RESTART (Enter)
                </button>
                <button id="restart-btn" class="px-8 py-3 bg-transparent border-2 border-white text-white font-bold rounded-full hover:bg-white/10 transition-all">
                    RETURN TO MENU
                </button>
            </div>
        </div>
    </div>

    <div id="game-win" class="fixed inset-0 flex items-center justify-center z-40 hidden bg-emerald-900/80 backdrop-blur-md">
        <div class="text-center text-white space-y-6">
            <h2 class="text-7xl font-black tracking-tighter italic">SUCCESS</h2>
            <p class="text-2xl font-medium opacity-80">Sequence complete.</p>
            <div class="flex flex-col gap-3 items-center">
                <button id="win-restart-btn" class="px-8 py-3 bg-white text-emerald-700 font-black rounded-full hover:bg-slate-100 transition-all transform hover:scale-110 shadow-xl">
                    INSTANT RESTART (Enter)
                </button>
                <button id="win-menu-btn" class="px-8 py-3 bg-transparent border-2 border-white text-white font-bold rounded-full hover:bg-white/10 transition-all">
                    RETURN TO MENU
                </button>
            </div>
        </div>
    </div>

    <script>
        const KEY_POOL = ['Q', 'E', 'R', 'F', 'A', 'D', 'W', 'S', ' '];

        const state = {
            playing: false,
            mode: 'bar',
            sequence: [],
            currentIndex: 0,
            timerStart: 0,
            timerDuration: 1500,
            isKeydown: {},
            misses: 0,
            maxMisses: 3,
            bgUrl: '',
            blur: 5,
            menuColor: '#ffffff',
            menuBorderColor: '#4f46e5',
            closeInPower: 0.7,
            spawnInterval: 900,
            circleLife: 1800,
            maxCircles: 3,
            activeQTEs: [],
            lastSpawnTime: 0,
            rafId: 0,
            timeouts: [],
            resolving: false
        };

        const el = {
            menu: document.getElementById('menu'),
            menuCard: document.getElementById('menu-card'),
            menuSettings: document.getElementById('menu-settings'),
            gameWorld: document.getElementById('game-world'),
            bg: document.getElementById('bg'),
            hud: document.getElementById('hud'),
            missText: document.getElementById('miss-count'),
            maxMissText: document.getElementById('max-misses-val'),
            gameOver: document.getElementById('game-over'),
            gameWin: document.getElementById('game-win'),
            startBtn: document.getElementById('start-btn'),
            restartBtn: document.getElementById('restart-btn'),
            quickRestartBtn: document.getElementById('quick-restart-btn'),
            winRestartBtn: document.getElementById('win-restart-btn'),
            winMenuBtn: document.getElementById('win-menu-btn'),
        };

        const CONFIGS = [
            { id: 'mode', label: 'QTE Mode', type: 'select', default: 'bar', options: [
                { value: 'bar', label: 'Bar (Chain)' },
                { value: 'circle', label: 'Circle' }
            ]},
            { id: 'seqLen', label: 'Sequence Length', type: 'number', default: 5, min: 1, modes: ['bar'] },
            { id: 'timePerKey', label: 'Time per Key (ms)', type: 'number', default: 1500, min: 200, modes: ['bar'] },
            { id: 'spawnInterval', label: 'Spawn Interval (ms)', type: 'number', default: 900, min: 200, modes: ['circle'] },
            { id: 'circleLife', label: 'Circle Lifetime (ms)', type: 'number', default: 1800, min: 400, modes: ['circle'] },
            { id: 'maxCircles', label: 'Max Circles', type: 'number', default: 3, min: 1, modes: ['circle'] },
            { id: 'maxMisses', label: 'Allowed Misses', type: 'number', default: 3, min: 1, modes: ['circle'] },
            { id: 'closeIn', label: 'Close-in Strength', type: 'range', min: 0, max: 20, step: 1, default: 12, unit: '', modes: ['circle'] },
            { id: 'bg', label: 'Background Image URL', type: 'text', default: '', placeholder: 'https://...' },
            { id: 'blur', label: 'Background Blur', type: 'range', min: 0, max: 20, step: 1, default: 5, unit: 'px' },
            { id: 'menuColor', label: 'Menu BG Color', type: 'color', default: '#ffffff' },
            { id: 'menuBorder', label: 'Menu Border Color', type: 'color', default: '#4f46e5' },
        ];

        function getVal(id) {
            const input = document.getElementById(`cfg-${id}`);
            return input ? input.value : '';
        }

        function applyMenuStyles() {
            const bgColor = getVal('menuColor') || state.menuColor;
            const borderColor = getVal('menuBorder') || state.menuBorderColor;
            el.menuCard.style.backgroundColor = bgColor;
            el.menuCard.style.borderColor = borderColor;
            el.menuCard.style.boxShadow = `0 0 20px ${borderColor}`;
            const isDark = isColorDark(bgColor);
            el.menuCard.querySelectorAll('h1, p, label').forEach(item => {
                item.style.color = isDark ? '#f8fafc' : '#1e293b';
            });
            const inputs = el.menuCard.querySelectorAll('input[type="text"], input[type="number"], select');
            inputs.forEach(input => {
                if (isDark) {
                    input.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                    input.style.color = 'white';
                    input.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                } else {
                    input.style.backgroundColor = 'white';
                    input.style.color = '#1e293b';
                    input.style.borderColor = '#cbd5e1';
                }
            });
            if (isDark) {
                el.startBtn.style.backgroundColor = '#334155';
                el.startBtn.style.color = '#f8fafc';
                el.startBtn.style.border = '1px solid #475569';
            } else {
                el.startBtn.style.backgroundColor = '#4f46e5';
                el.startBtn.style.color = 'white';
                el.startBtn.style.border = 'none';
            }
        }

        function isColorDark(color) {
            const hex = color.replace('#', '');
            if (hex.length === 3) return isColorDark('#' + hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]);
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return ((r * 299 + g * 587 + b * 114) / 1000) < 128;
        }

        function updateModeFields() {
            const mode = getVal('mode') || 'bar';
            CONFIGS.forEach(conf => {
                if (!conf.modes) return;
                const row = document.getElementById(`row-${conf.id}`);
                if (row) row.hidden = !conf.modes.includes(mode);
            });
        }

        function buildMenu() {
            el.menuSettings.innerHTML = '';
            CONFIGS.forEach(conf => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col gap-1 cfg-row';
                wrapper.id = `row-${conf.id}`;
                const label = document.createElement('label');
                label.className = 'block text-sm font-bold text-slate-700 mb-1';
                const valSpan = conf.type === 'range'
                    ? ` <span id="val-${conf.id}">${conf.default}</span>${conf.unit || ''}`
                    : '';
                label.innerHTML = `${conf.label}${valSpan}`;

                if (conf.type === 'select') {
                    const select = document.createElement('select');
                    select.id = `cfg-${conf.id}`;
                    select.className = 'w-full p-2 border rounded-lg outline-none focus:ring-2 ring-indigo-500 bg-white';
                    conf.options.forEach(opt => {
                        const o = document.createElement('option');
                        o.value = opt.value;
                        o.innerText = opt.label;
                        if (opt.value === conf.default) o.selected = true;
                        select.appendChild(o);
                    });
                    select.onchange = updateModeFields;
                    wrapper.appendChild(label);
                    wrapper.appendChild(select);
                    el.menuSettings.appendChild(wrapper);
                    return;
                }

                const input = document.createElement('input');
                input.id = `cfg-${conf.id}`;
                input.value = conf.default;
                if (conf.type === 'text') {
                    input.className = 'w-full p-2 border rounded-lg outline-none focus:ring-2 ring-indigo-500';
                    input.placeholder = conf.placeholder || '';
                } else if (conf.type === 'range') {
                    input.type = 'range'; input.min = conf.min; input.max = conf.max; input.step = conf.step;
                    input.className = 'w-full accent-indigo-600';
                    input.oninput = () => {
                        const valEl = document.getElementById(`val-${conf.id}`);
                        if (valEl) valEl.innerText = input.value;
                    };
                } else if (conf.type === 'number') {
                    input.type = 'number'; input.min = conf.min;
                    input.className = 'w-full p-2 border rounded-lg outline-none focus:ring-2 ring-indigo-500';
                } else if (conf.type === 'color') {
                    input.type = 'color'; input.className = 'w-full h-10 p-1 border rounded-lg cursor-pointer';
                    input.oninput = applyMenuStyles;
                }
                wrapper.appendChild(label);
                wrapper.appendChild(input);
                el.menuSettings.appendChild(wrapper);
            });
            updateModeFields();
            applyMenuStyles();
        }

        function randomKey() {
            return KEY_POOL[Math.floor(Math.random() * KEY_POOL.length)];
        }

        function displayKey(key) {
            return key === ' ' ? 'SPACE' : key;
        }

        function normalizeEventKey(e) {
            if (e.code === 'Space' || e.key === ' ') return ' ';
            if (e.key && e.key.length === 1) return e.key.toUpperCase();
            return e.key;
        }

        function holdId(e) {
            return e.code || e.key;
        }

        function later(fn, ms) {
            const id = setTimeout(fn, ms);
            state.timeouts.push(id);
            return id;
        }

        function clearRuntime() {
            state.playing = false;
            state.resolving = false;
            state.isKeydown = {};
            if (state.rafId) cancelAnimationFrame(state.rafId);
            state.rafId = 0;
            state.timeouts.forEach(clearTimeout);
            state.timeouts = [];
            state.activeQTEs = [];
            el.gameWorld.classList.remove('shake');
            el.gameWorld.querySelectorAll('.qte-prompt-container, .qte-circle, .hit-ring-ghost').forEach(n => n.remove());
        }

        function readConfig() {
            state.mode = getVal('mode') || 'bar';
            state.bgUrl = getVal('bg');
            state.blur = parseInt(getVal('blur'), 10) || 0;
            state.menuColor = getVal('menuColor');
            state.menuBorderColor = getVal('menuBorder');
            state.timerDuration = parseInt(getVal('timePerKey'), 10) || 1500;
            state.spawnInterval = parseInt(getVal('spawnInterval'), 10) || 900;
            state.circleLife = parseInt(getVal('circleLife'), 10) || 1800;
            state.maxCircles = parseInt(getVal('maxCircles'), 10) || 3;
            state.maxMisses = parseInt(getVal('maxMisses'), 10) || 3;
            state.closeInPower = (parseInt(getVal('closeIn'), 10) || 0) / 20;
        }

        function generateSequence() {
            const seqLen = parseInt(getVal('seqLen'), 10) || 5;
            state.sequence = [];
            for (let i = 0; i < seqLen; i++) state.sequence.push(randomKey());
            state.currentIndex = 0;
        }

        function applyWorld() {
            applyMenuStyles();
            if (state.bgUrl) el.bg.style.backgroundImage = `url('${state.bgUrl}')`;
            else {
                el.bg.style.backgroundImage = 'none';
                el.bg.style.backgroundColor = '#000';
            }
            el.bg.style.filter = `blur(${state.blur}px)`;
        }

        function startGame() {
            clearRuntime();
            readConfig();
            generateSequence();
            state.misses = 0;
            el.missText.innerText = '0';
            el.maxMissText.innerText = String(state.maxMisses);
            applyWorld();
            el.menu.classList.add('hidden');
            el.gameOver.classList.add('hidden');
            el.gameWin.classList.add('hidden');
            el.hud.classList.toggle('hidden', state.mode !== 'circle');
            state.playing = true;
            state.lastSpawnTime = Date.now() - state.spawnInterval;
            if (state.mode === 'bar') spawnBarPrompt();
            loop();
        }

        function returnToMenu() {
            clearRuntime();
            el.gameOver.classList.add('hidden');
            el.gameWin.classList.add('hidden');
            el.hud.classList.add('hidden');
            el.menu.classList.remove('hidden');
            el.bg.style.filter = 'none';
        }

        function quickRestart() {
            clearRuntime();
            startGame();
        }

        el.startBtn.onclick = startGame;
        el.restartBtn.onclick = returnToMenu;
        el.winMenuBtn.onclick = returnToMenu;
        el.quickRestartBtn.onclick = quickRestart;
        el.winRestartBtn.onclick = quickRestart;

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        function onKeyDown(e) {
            const ended = !el.gameOver.classList.contains('hidden') || !el.gameWin.classList.contains('hidden');
            if (e.key === 'Enter' && ended) {
                e.preventDefault();
                quickRestart();
                return;
            }

            if (e.code === 'Space') e.preventDefault();

            if (!state.playing || state.resolving) return;

            const id = holdId(e);
            if (state.isKeydown[id]) return;
            state.isKeydown[id] = true;

            processInput(normalizeEventKey(e));
        }

        function onKeyUp(e) {
            state.isKeydown[holdId(e)] = false;
        }

        function processInput(key) {
            if (state.mode === 'bar') processBarInput(key);
            else processCircleInput(key);
        }

        function spawnBarPrompt() {
            el.gameWorld.querySelectorAll('.qte-prompt-container').forEach(n => n.remove());
            const key = state.sequence[state.currentIndex];

            const container = document.createElement('div');
            container.className = 'qte-prompt-container';

            const keyEl = document.createElement('div');
            keyEl.className = 'qte-key' + (key === ' ' ? ' space-key' : '');
            keyEl.id = 'current-qte-key';
            keyEl.innerText = displayKey(key);

            const timerCont = document.createElement('div');
            timerCont.className = 'timer-container';
            const timerBar = document.createElement('div');
            timerBar.className = 'timer-bar';
            timerBar.id = 'qte-timer-bar';
            timerCont.appendChild(timerBar);

            const progress = document.createElement('div');
            progress.className = 'seq-progress';
            progress.id = 'qte-seq-progress';
            progress.innerText = `${state.currentIndex + 1} / ${state.sequence.length}`;

            container.appendChild(keyEl);
            container.appendChild(timerCont);
            container.appendChild(progress);
            el.gameWorld.appendChild(container);

            state.timerStart = Date.now();
            state.resolving = false;
        }

        function processBarInput(key) {
            const expected = state.sequence[state.currentIndex];
            const keyEl = document.getElementById('current-qte-key');
            if (key === expected) barHit(keyEl);
            else barFail(keyEl);
        }

        function barHit(keyEl) {
            state.resolving = true;
            if (keyEl) {
                keyEl.classList.remove('urgent');
                keyEl.classList.add('qte-success');
            }
            later(() => {
                if (!state.playing) return;
                state.currentIndex++;
                if (state.currentIndex >= state.sequence.length) {
                    winGame();
                    return;
                }
                spawnBarPrompt();
            }, 90);
        }

        function barFail(keyEl) {
            state.resolving = true;
            if (keyEl) {
                keyEl.classList.remove('urgent');
                keyEl.classList.add('qte-fail');
            }
            later(() => endGame(), 220);
        }

        function spawnCircle() {
            if (!state.playing || state.activeQTEs.length >= state.maxCircles) return;

            const used = new Set(state.activeQTEs.map(q => q.key));
            let key = randomKey();
            let guard = 0;
            while (used.has(key) && guard < 12) {
                key = randomKey();
                guard++;
            }

            const qte = document.createElement('div');
            qte.className = 'qte-circle';
            qte.style.left = (Math.random() * 70 + 15) + '%';
            qte.style.top = (Math.random() * 70 + 15) + '%';

            const target = document.createElement('div');
            target.className = 'target' + (key === ' ' ? ' space-key' : '');
            target.innerText = displayKey(key);

            const life = document.createElement('div');
            life.className = 'circle-life';
            const lifeBar = document.createElement('div');
            lifeBar.className = 'circle-life-bar';
            life.appendChild(lifeBar);

            qte.appendChild(target);
            qte.appendChild(life);
            el.gameWorld.appendChild(qte);

            state.activeQTEs.push({
                element: qte,
                lifeBar,
                key,
                startTime: Date.now(),
                duration: state.circleLife
            });
        }

        function processCircleInput(key) {
            const match = state.activeQTEs.find(q => q.key === key);
            if (match) circleHit(match);
            else circleMiss(null);
        }

        function triggerCloseIn() {
            const power = state.closeInPower;
            if (power <= 0) return;
            el.gameWorld.style.setProperty('--scale-min', String(1 - (0.22 * power)));
            el.gameWorld.style.setProperty('--scale-max', String(1 + (0.06 * power)));
            el.gameWorld.classList.remove('shake');
            void el.gameWorld.offsetWidth;
            el.gameWorld.classList.add('shake');
            later(() => el.gameWorld.classList.remove('shake'), 250);
        }

        function circleHit(qteData) {
            triggerCloseIn();
            const rect = qteData.element.getBoundingClientRect();
            const world = el.gameWorld.getBoundingClientRect();
            const ghost = document.createElement('div');
            ghost.className = 'hit-ring-ghost';
            ghost.style.left = (rect.left + rect.width / 2 - world.left) + 'px';
            ghost.style.top = (rect.top + rect.height / 2 - world.top) + 'px';
            el.gameWorld.appendChild(ghost);
            later(() => ghost.remove(), 900);

            qteData.element.classList.add('fade-out');
            state.activeQTEs = state.activeQTEs.filter(q => q !== qteData);
            later(() => qteData.element.remove(), 220);
        }

        function circleMiss(qteData) {
            triggerCloseIn();
            state.misses++;
            el.missText.innerText = String(state.misses);

            if (qteData) {
                qteData.element.classList.add('fade-out');
                state.activeQTEs = state.activeQTEs.filter(q => q !== qteData);
                later(() => qteData.element.remove(), 220);
            }

            if (state.misses >= state.maxMisses) endGame();
        }

        function loop() {
            if (!state.playing) return;
            if (state.mode === 'bar') tickBar();
            else tickCircle();
            state.rafId = requestAnimationFrame(loop);
        }

        function tickBar() {
            if (state.resolving) return;
            const elapsed = Date.now() - state.timerStart;
            const progress = Math.max(0, 1 - (elapsed / state.timerDuration));
            const bar = document.getElementById('qte-timer-bar');
            const keyEl = document.getElementById('current-qte-key');
            if (bar) {
                bar.style.width = (progress * 100) + '%';
                bar.style.backgroundColor = progress < 0.3 ? '#ef4444' : '#4f46e5';
            }
            if (keyEl) keyEl.classList.toggle('urgent', progress < 0.3);
            if (elapsed >= state.timerDuration) barFail(keyEl);
        }

        function tickCircle() {
            const now = Date.now();
            if (now - state.lastSpawnTime >= state.spawnInterval) {
                spawnCircle();
                state.lastSpawnTime = now;
            }
            [...state.activeQTEs].forEach(q => {
                const elapsed = now - q.startTime;
                const progress = Math.max(0, 1 - (elapsed / q.duration));
                if (q.lifeBar) {
                    q.lifeBar.style.width = (progress * 100) + '%';
                    q.lifeBar.style.backgroundColor = progress < 0.3 ? '#ef4444' : '#4f46e5';
                }
                if (elapsed >= q.duration) circleMiss(q);
            });
        }

        function endGame() {
            clearRuntime();
            el.gameWin.classList.add('hidden');
            el.gameOver.classList.remove('hidden');
        }

        function winGame() {
            clearRuntime();
            el.gameOver.classList.add('hidden');
            el.gameWin.classList.remove('hidden');
        }

        buildMenu();
    </script>
</body>
</html>
