<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkQTE - The Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        .game-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: filter 0.5s ease;
            z-index: -1;
            background-color: #000;
        }

        .qte-circle {
            position: absolute;
            transform: translate(-50%, -50%);
            user-select: none;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid white;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        .target {
            width: 100px;
            height: 100px;
            background: rgba(60, 60, 60, 0.8);
            border: 2px solid #888;
            border-radius: 50%;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hit-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }

        .pulse {
            animation: pulse-anim 0.5s ease-out;
        }

        @keyframes pulse-anim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        .fade-out {
            animation: fadeOut 0.3s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body class="bg-black">

    <div id="bg" class="game-bg"></div>

    <!-- Menu Screen -->
    <div id="menu" class="fixed inset-0 flex items-center justify-center z-20 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6 border-t-8 border-indigo-600">
            <div class="text-center">
                <h1 class="text-4xl font-black text-slate-800 tracking-tight">INK QTE</h1>
                <p class="text-slate-500">Configure your challenge</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Background Image URL (Optional)</label>
                    <input type="text" id="cfg-bg" class="w-full p-2 border rounded-lg outline-none focus:ring-2 ring-indigo-500" placeholder="https://...">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Game Speed (<span id="val-speed">1</span>x)</label>
                        <input type="range" id="cfg-speed" min="0.5" max="5" step="0.1" value="1" class="w-full accent-indigo-600">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Spawn Delay (<span id="val-delay">2</span>s)</label>
                        <input type="range" id="cfg-delay" min="0" max="5" step="0.1" value="2" class="w-full accent-indigo-600">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Background Blur (<span id="val-blur">5</span>px)</label>
                    <input type="range" id="cfg-blur" min="0" max="20" step="1" value="5" class="w-full accent-indigo-600">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Allowed Misses</label>
                    <input type="number" id="cfg-misses" class="w-full p-2 border rounded-lg outline-none focus:ring-2 ring-indigo-500" value="3" min="1">
                </div>
            </div>

            <button id="start-btn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xl rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                START GAME
            </button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="fixed top-6 left-6 z-30 hidden">
        <div class="bg-black/50 backdrop-blur-md text-white px-4 py-2 rounded-full font-bold border border-white/20">
            Misses: <span id="miss-count" class="text-red-400">0</span> / <span id="max-misses-val">3</span>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="fixed inset-0 flex items-center justify-center z-40 hidden bg-red-900/80 backdrop-blur-md">
        <div class="text-center text-white space-y-6">
            <h2 class="text-7xl font-black tracking-tighter italic">GAME OVER</h2>
            <p class="text-2xl font-medium opacity-80">You failed the trial.</p>
            <div class="flex flex-col gap-3 items-center">
                <button id="quick-restart-btn" class="px-8 py-3 bg-white text-red-600 font-black rounded-full hover:bg-slate-100 transition-all transform hover:scale-110 shadow-xl">
                    INSTANT RESTART (Enter)
                </button>
                <button id="restart-btn" class="px-8 py-3 bg-transparent border-2 border-white text-white font-bold rounded-full hover:bg-white/10 transition-all">
                    RETURN TO MENU
                </button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            playing: false,
            misses: 0,
            maxMisses: 3,
            speed: 1,
            spawnDelay: 2,
            blur: 5,
            bgUrl: '',
            currentQTE: null,
            isSpawning: false
        };

        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        const el = {
            menu: document.getElementById('menu'),
            bg: document.getElementById('bg'),
            hud: document.getElementById('hud'),
            missText: document.getElementById('miss-count'),
            maxMissText: document.getElementById('max-misses-val'),
            gameOver: document.getElementById('game-over'),
            startBtn: document.getElementById('start-btn'),
            restartBtn: document.getElementById('restart-btn'),
            quickRestartBtn: document.getElementById('quick-restart-btn'),
            cfgBg: document.getElementById('cfg-bg'),
            cfgSpeed: document.getElementById('cfg-speed'),
            cfgDelay: document.getElementById('cfg-delay'),
            cfgBlur: document.getElementById('cfg-blur'),
            cfgMisses: document.getElementById('cfg-misses'),
            valSpeed: document.getElementById('val-speed'),
            valDelay: document.getElementById('val-delay'),
            valBlur: document.getElementById('val-blur')
        };

        el.cfgSpeed.oninput = () => el.valSpeed.innerText = el.cfgSpeed.value;
        el.cfgDelay.oninput = () => el.valDelay.innerText = el.cfgDelay.value;
        el.cfgBlur.oninput = () => el.valBlur.innerText = el.cfgBlur.value;

        el.startBtn.onclick = () => {
            state.bgUrl = el.cfgBg.value;
            state.speed = parseFloat(el.cfgSpeed.value);
            state.spawnDelay = parseFloat(el.cfgDelay.value);
            state.blur = parseInt(el.cfgBlur.value);
            state.maxMisses = parseInt(el.cfgMisses.value);
            state.misses = 0;

            if (state.bgUrl) {
                el.bg.style.backgroundImage = `url('${state.bgUrl}')`;
            } else {
                el.bg.style.backgroundImage = 'none';
                el.bg.style.backgroundColor = '#000';
            }

            el.bg.style.filter = `blur(${state.blur}px)`;
            el.menu.classList.add('hidden');
            el.hud.classList.remove('hidden');
            el.maxMissText.innerText = state.maxMisses;
            el.missText.innerText = state.misses;

            state.playing = true;
            state.isSpawning = false;
            spawnQTE();
        };

        el.restartBtn.onclick = () => {
            el.gameOver.classList.add('hidden');
            el.menu.classList.remove('hidden');
            el.hud.classList.add('hidden');
            el.bg.style.filter = 'none';
        };

        el.quickRestartBtn.onclick = quickRestart;

        function quickRestart() {
            state.misses = 0;
            el.missText.innerText = state.misses;
            el.gameOver.classList.add('hidden');
            state.playing = true;
            state.isSpawning = false;
            spawnQTE();
        }

        window.onkeydown = (e) => {
            if (e.key === 'Enter' && !el.gameOver.classList.contains('hidden')) {
                quickRestart();
                return;
            }

            if (!state.playing || !state.currentQTE) return;

            const pressedKey = e.key.toUpperCase();
            if (pressedKey === state.currentQTE.key) {
                const elapsed = Date.now() - state.currentQTE.startTime;
                const progress = elapsed / state.currentQTE.duration;

                const currentSize = 250 - (200 * progress);

                if (currentSize <= 130 && currentSize >= 70) {
                    handleHit();
                } else {
                    handleMiss();
                }
            } else {
                handleMiss();
            }
        };

        function spawnQTE() {
            if (!state.playing || state.isSpawning) return;
            state.isSpawning = true;

            const randomLetter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
            const qte = document.createElement('div');
            qte.className = 'qte-circle';

            const x = Math.random() * 70 + 15;
            const y = Math.random() * 70 + 15;
            qte.style.left = x + '%';
            qte.style.top = y + '%';

            const target = document.createElement('div');
            target.className = 'target';
            target.innerText = randomLetter;

            const ring = document.createElement('div');
            ring.className = 'ring';

            const hitZone = document.createElement('div');
            hitZone.className = 'hit-zone';

            qte.appendChild(hitZone);
            qte.appendChild(target);
            qte.appendChild(ring);
            document.body.appendChild(qte);

            state.currentQTE = {
                element: qte,
                ring: ring,
                key: randomLetter,
                startTime: Date.now(),
                duration: 2000 / state.speed,
            };

            const animate = () => {
                if (!state.playing || !state.currentQTE || state.currentQTE.element !== qte) return;

                const elapsed = Date.now() - state.currentQTE.startTime;
                const progress = elapsed / state.currentQTE.duration;

                if (progress >= 1) {
                    handleMiss();
                    return;
                }

                const size = 250 - (200 * progress);
                ring.style.width = size + 'px';
                ring.style.height = size + 'px';

                requestAnimationFrame(animate);
            };

            requestAnimationFrame(animate);
        }

        function handleHit() {
            if (!state.currentQTE) return;
            const element = state.currentQTE.element;
            state.currentQTE = null;

            const hitEffect = document.createElement('div');
            hitEffect.className = 'fixed inset-0 pointer-events-none z-50 flex items-center justify-center';
            hitEffect.innerHTML = '<div class="pulse w-32 h-32 border-4 border-green-400 rounded-full"></div>';
            document.body.appendChild(hitEffect);
            setTimeout(() => hitEffect.remove(), 500);

            element.classList.add('fade-out');
            setTimeout(() => {
                element.remove();
                if (state.playing) {
                    setTimeout(() => {
                        state.isSpawning = false;
                        spawnQTE();
                    }, (state.spawnDelay * 1000) + (Math.random() * 500));
                }
            }, 300);
        }

        function handleMiss() {
            if (!state.currentQTE) return;
            const element = state.currentQTE.element;
            state.currentQTE = null;

            state.misses++;
            el.missText.innerText = state.misses;

            if (element) {
                element.classList.add('fade-out');
                setTimeout(() => {
                    element.remove();
                }, 300);
            }

            if (state.misses >= state.maxMisses) {
                endGame();
            } else {
                if (state.playing) {
                    setTimeout(() => {
                        state.isSpawning = false;
                        spawnQTE();
                    }, (state.spawnDelay * 1000) + (Math.random() * 500));
                }
            }
        }

        function endGame() {
            state.playing = false;
            el.gameOver.classList.remove('hidden');
        }

    </script>
</body>
</html>
