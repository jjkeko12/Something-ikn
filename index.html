<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkQTE - The Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #game-world {
            width: 100vw;
            height: 100vh;
            transition: filter 0.5s ease;
            position: relative;
        }

        .game-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            background-color: #000;
        }

        .qte-circle {
            position: absolute;
            transform: translate(-50%, -50%);
            user-select: none;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid white;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        .target {
            width: 100px;
            height: 100px;
            background: rgba(60, 60, 60, 0.8);
            border: 2px solid #888;
            border-radius: 50%;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hit-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }

        .hit-ring-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid #4ade80;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            animation: expand-fade 0.6s ease-out forwards;
        }

        .hit-ring-ghost {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #22c55e;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: ghost-fade 0.8s ease-out forwards;
        }

        @keyframes expand-fade {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }

        @keyframes ghost-fade {
            0% { width: 0; height: 0; opacity: 0.8; }
            20% { width: 150px; height: 150px; opacity: 0.6; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        .shake {
            animation: shake-anim 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake-anim {
            10%, 90% { transform: translate3d(calc(-1px * var(--shake-power)), 0, 0); }
            20%, 80% { transform: translate3d(calc(2px * var(--shake-power)), 0, 0); }
            30%, 70% { transform: translate3d(calc(-4px * var(--shake-power)), 0, 0); }
            40%, 60% { transform: translate3d(calc(4px * var(--shake-power)), 0, 0); }
        }

        .fade-out {
            animation: fadeOut 0.3s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body class="bg-black">

    <div id="game-world">
        <div id="bg" class="game-bg"></div>
    </div>

    <div id="menu" class="fixed inset-0 flex items-center justify-center z-20 bg-slate-900/60 backdrop-blur-sm">
        <div id="menu-card" class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6 transition-all duration-300" style="border: 4px solid #4f46e5; box-shadow: 0 0 20px #4f46e5;">
            <div class="text-center">
                <h1 class="text-4xl font-black text-slate-800 tracking-tight">INK QTE</h1>
                <p class="text-slate-500">Configure your challenge</p>
            </div>

            <div id="menu-settings" class="space-y-4">
                <!-- Settings injected by JS -->
            </div>

            <button id="start-btn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xl rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                START GAME
            </button>
        </div>
    </div>

    <div id="hud" class="fixed top-6 left-6 z-30 hidden">
        <div class="bg-black/50 backdrop-blur-md text-white px-4 py-2 rounded-full font-bold border border-white/20">
            Misses: <span id="miss-count" class="text-red-400">0</span> / <span id="max-misses-val">3</span>
        </div>
    </div>

    <div id="game-over" class="fixed inset-0 flex items-center justify-center z-40 hidden bg-red-900/80 backdrop-blur-md">
        <div class="text-center text-white space-y-6">
            <h2 class="text-7xl font-black tracking-tighter italic">GAME OVER</h2>
            <p class="text-2xl font-medium opacity-80">You failed the trial.</p>
            <div class="flex flex-col gap-3 items-center">
                <button id="quick-restart-btn" class="px-8 py-3 bg-white text-red-600 font-black rounded-full hover:bg-slate-100 transition-all transform hover:scale-110 shadow-xl">
                    INSTANT RESTART (Enter)
                </button>
                <button id="restart-btn" class="px-8 py-3 bg-transparent border-2 border-white text-white font-bold rounded-full hover:bg-white/10 transition-all">
                    RETURN TO MENU
                </button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            playing: false,
            misses: 0,
            maxMisses: 3,
            speed: 1,
            overlapDelay: 2,
            hitShakePower: 1.5,
            missShakePower: 0.8,
            blur: 5,
            bgUrl: '',
            activeQTEs: [],
            lastSpawnTime: 0,
            menuColor: '#ffffff',
            menuBorderColor: '#4f46e5'
        };

        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        const el = {
            menu: document.getElementById('menu'),
            menuCard: document.getElementById('menu-card'),
            menuSettings: document.getElementById('menu-settings'),
            gameWorld: document.getElementById('game-world'),
            bg: document.getElementById('bg'),
            hud: document.getElementById('hud'),
            missText: document.getElementById('miss-count'),
            maxMissText: document.getElementById('max-misses-val'),
            gameOver: document.getElementById('game-over'),
            startBtn: document.getElementById('start-btn'),
            restartBtn: document.getElementById('restart-btn'),
            quickRestartBtn: document.getElementById('quick-restart-btn'),
        };

        const CONFIGS = [
            { id: 'bg', label: 'Background Image URL', type: 'text', default: '', placeholder: 'https://...' },
            { id: 'speed', label: 'Game Speed', type: 'range', min: 0.5, max: 5, step: 0.1, default: 1, unit: 'x' },
            { id: 'overlap', label: 'Overlap Delay', type: 'range', min: 0, max: 5, step: 0.1, default: 2, unit: 's' },
            { id: 'hitShake', label: 'Hit Shake', type: 'range', min: 0, max: 5, step: 0.1, default: 1.5, unit: '', color: 'accent-green-600' },
            { id: 'missShake', label: 'Miss Shake', type: 'range', min: 0, max: 5, step: 0.1, default: 0.8, unit: '', color: 'accent-red-600' },
            { id: 'blur', label: 'Background Blur', type: 'range', min: 0, max: 20, step: 1, default: 5, unit: 'px' },
            { id: 'misses', label: 'Allowed Misses', type: 'number', default: 3, min: 1 },
            { id: 'menuColor', label: 'Menu BG Color', type: 'color', default: '#ffffff' },
            { id: 'menuBorder', label: 'Menu Border Color', type: 'color', default: '#4f46e5' },
        ];

        function applyMenuStyles() {
            const bgColor = document.getElementById('cfg-menuColor')?.value || state.menuColor;
            const borderColor = document.getElementById('cfg-menuBorder')?.value || state.menuBorderColor;

            el.menuCard.style.backgroundColor = bgColor;
            el.menuCard.style.borderColor = borderColor;
            el.menuCard.style.boxShadow = `0 0 20px ${borderColor}`;

            // Contrast check for text color
            const isDark = isColorDark(bgColor);
            el.menuCard.querySelectorAll('h1, p, label').forEach(item => {
                item.style.color = isDark ? 'white' : '#1e293b';
            });
        }

        function isColorDark(color) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness < 128;
        }

        function buildMenu() {
            el.menuSettings.innerHTML = '';
            CONFIGS.forEach(conf => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col gap-1';

                const label = document.createElement('label');
                label.className = 'block text-sm font-bold text-slate-700 mb-1';
                label.innerHTML = `${conf.label} <span id="val-${conf.id}">${conf.default}</span>${conf.unit || ''}`;

                const input = document.createElement('input');
                input.id = `cfg-${conf.id}`;
                input.value = conf.default;

                if (conf.type === 'text') {
                    input.className = 'w-full p-2 border rounded-lg outline-none focus:ring-2 ring-indigo-500';
                    input.placeholder = conf.placeholder;
                } else if (conf.type === 'range') {
                    input.type = 'range';
                    input.min = conf.min;
                    input.max = conf.max;
                    input.step = conf.step;
                    input.className = `w-full ${conf.color || 'accent-indigo-600'}`;
                    input.oninput = () => {
                        const valEl = document.getElementById(`val-${conf.id}`);
                        if (valEl) valEl.innerText = input.value;
                    };
                } else if (conf.type === 'number') {
                    input.type = 'number';
                    input.min = conf.min;
                    input.className = 'w-full p-2 border rounded-lg outline-none focus:ring-2 ring-indigo-500';
                } else if (conf.type === 'color') {
                    input.type = 'color';
                    input.className = 'w-full h-10 p-1 border rounded-lg cursor-pointer';
                    input.oninput = applyMenuStyles;
                }

                wrapper.appendChild(label);
                wrapper.appendChild(input);
                el.menuSettings.appendChild(wrapper);
            });
            applyMenuStyles();
        }

        el.startBtn.onclick = () => {
            const getVal = (id) => {
                const input = document.getElementById(`cfg-${id}`);
                return input ? input.value : '';
            };

            state.bgUrl = getVal('bg');
            state.speed = parseFloat(getVal('speed')) || 1;
            state.overlapDelay = parseFloat(getVal('overlap')) || 2;
            state.hitShakePower = parseFloat(getVal('hitShake')) || 1.5;
            state.missShakePower = parseFloat(getVal('missShake')) || 0.8;
            state.blur = parseInt(getVal('blur')) || 5;
            state.maxMisses = parseInt(getVal('misses')) || 3;
            state.menuColor = getVal('menuColor');
            state.menuBorderColor = getVal('menuBorder');
            state.misses = 0;

            applyMenuStyles();

            if (state.bgUrl) {
                el.bg.style.backgroundImage = `url('${state.bgUrl}')`;
            } else {
                el.bg.style.backgroundImage = 'none';
                el.bg.style.backgroundColor = '#000';
            }

            el.gameWorld.style.filter = `blur(${state.blur}px)`;
            el.menu.classList.add('hidden');
            el.hud.classList.remove('hidden');
            el.maxMissText.innerText = state.maxMisses;
            el.missText.innerText = state.misses;

            state.playing = true;
            state.activeQTEs = [];
            state.lastSpawnTime = Date.now();

            spawnQTE();
            gameLoop();
        };

        el.restartBtn.onclick = () => {
            el.gameOver.classList.add('hidden');
            el.menu.classList.remove('hidden');
            el.hud.classList.add('hidden');
            el.gameWorld.style.filter = 'none';
        };

        el.quickRestartBtn.onclick = quickRestart;

        function quickRestart() {
            state.misses = 0;
            el.missText.innerText = state.misses;
            el.gameOver.classList.add('hidden');
            state.playing = true;
            state.activeQTEs = [];
            state.lastSpawnTime = Date.now();
            spawnQTE();
            gameLoop();
        }

        window.onkeydown = (e) => {
            if (e.key === 'Enter' && !el.gameOver.classList.contains('hidden')) {
                quickRestart();
                return;
            }

            if (!state.playing || state.activeQTEs.length === 0) return;

            const pressedKey = e.key.toUpperCase();
            const targetQTE = state.activeQTEs[0];

            if (pressedKey === targetQTE.key) {
                const elapsed = Date.now() - targetQTE.startTime;
                const progress = elapsed / targetQTE.duration;
                const currentSize = 250 - (200 * progress);

                if (currentSize <= 130 && currentSize >= 70) {
                    handleHit(targetQTE);
                } else {
                    handleMiss(targetQTE);
                }
            } else {
                handleMiss(targetQTE);
            }
        };

        function gameLoop() {
            if (!state.playing) return;

            const now = Date.now();
            if (now - state.lastSpawnTime >= state.overlapDelay * 1000) {
                spawnQTE();
                state.lastSpawnTime = now;
            }

            requestAnimationFrame(gameLoop);
        }

        function spawnQTE() {
            if (!state.playing) return;

            const randomLetter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
            const qte = document.createElement('div');
            qte.className = 'qte-circle';

            const x = Math.random() * 70 + 15;
            const y = Math.random() * 70 + 15;
            qte.style.left = x + '%';
            qte.style.top = y + '%';

            const target = document.createElement('div');
            target.className = 'target';
            target.innerText = randomLetter;

            const ring = document.createElement('div');
            ring.className = 'ring';

            const hitZone = document.createElement('div');
            hitZone.className = 'hit-zone';

            qte.appendChild(hitZone);
            qte.appendChild(target);
            qte.appendChild(ring);
            document.body.appendChild(qte);

            const qteData = {
                element: qte,
                ring: ring,
                key: randomLetter,
                startTime: Date.now(),
                duration: 2000 / state.speed,
            };

            state.activeQTEs.push(qteData);

            const animate = () => {
                if (!state.playing || !state.activeQTEs.includes(qteData)) return;

                const elapsed = Date.now() - qteData.startTime;
                const progress = elapsed / qteData.duration;

                if (progress >= 1) {
                    handleMiss(qteData);
                    return;
                }

                const size = 250 - (200 * progress);
                ring.style.width = size + 'px';
                ring.style.height = size + 'px';

                requestAnimationFrame(animate);
            };

            requestAnimationFrame(animate);
        }

        function triggerShake(power) {
            el.gameWorld.style.setProperty('--shake-power', power);
            el.gameWorld.classList.add('shake');
            setTimeout(() => el.gameWorld.classList.remove('shake'), 200);
        }

        function handleHit(qteData) {
            triggerShake(state.hitShakePower);

            const outer = document.createElement('div');
            outer.className = 'hit-ring-outer';
            const ghost = document.createElement('div');
            ghost.className = 'hit-ring-ghost';

            qteData.element.appendChild(outer);
            qteData.element.appendChild(ghost);

            setTimeout(() => {
                if (outer.parentNode) outer.remove();
                if (ghost.parentNode) ghost.remove();
            }, 800);

            qteData.element.classList.add('fade-out');
            state.activeQTEs = state.activeQTEs.filter(q => q !== qteData);
            setTimeout(() => qteData.element.remove(), 300);
        }

        function handleMiss(qteData) {
            triggerShake(state.missShakePower);

            state.misses++;
            el.missText.innerText = state.misses;

            qteData.element.classList.add('fade-out');
            state.activeQTEs = state.activeQTEs.filter(q => q !== qteData);
            setTimeout(() => qteData.element.remove(), 300);

            if (state.misses >= state.maxMisses) {
                endGame();
            }
        }

        function endGame() {
            state.playing = false;
            el.gameOver.classList.remove('hidden');
        }

        buildMenu();
    </script>
</body>
</html>
